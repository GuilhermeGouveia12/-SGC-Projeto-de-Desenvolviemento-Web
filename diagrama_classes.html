
<style>
.cls-box { fill: #fff; stroke: #334; stroke-width: 0.5px; }
.cls-header { stroke: #334; stroke-width: 0.5px; }
.cls-title { font-size: 13px; font-weight: 500; fill: #fff; font-family: sans-serif; }
.cls-attr { font-size: 11px; fill: #1a1a2e; font-family: sans-serif; }
.cls-method { font-size: 11px; fill: #1f4e79; font-family: sans-serif; font-style: italic; }
.cls-rel { fill: none; stroke: #334; stroke-width: 0.8px; }
.cls-card { font-size: 11px; fill: #334; font-family: sans-serif; font-weight: 500; }
.cls-legend { font-size: 11px; fill: #334; font-family: sans-serif; }
</style>

<svg width="100%" viewBox="0 0 680 820" xmlns="http://www.w3.org/2000/svg">
  <title>Diagrama de Classes — SGC</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#334" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="10" markerHeight="8" orient="auto-start-reverse">
      <polygon points="1,5 6,1 11,5 6,9" fill="#334" stroke="#334" stroke-width="0.8"/>
    </marker>
  </defs>

  <!-- ── USUARIO ── -->
  <rect x="40" y="30" width="170" height="26" rx="4" class="cls-header" fill="#3c3489"/>
  <text class="cls-title" x="125" y="43" text-anchor="middle" dominant-baseline="central">Usuario</text>
  <rect x="40" y="56" width="170" height="130" rx="0" class="cls-box"/>
  <line x1="40" y1="82" x2="210" y2="82" stroke="#334" stroke-width="0.5"/>
  <text class="cls-attr" x="52" y="72" dominant-baseline="central">id: int (PK)</text>
  <text class="cls-attr" x="52" y="94" dominant-baseline="central">username: str</text>
  <text class="cls-attr" x="52" y="112" dominant-baseline="central">senha: str (hash)</text>
  <text class="cls-attr" x="52" y="130" dominant-baseline="central">perfil: enum</text>
  <text class="cls-attr" x="52" y="148" dominant-baseline="central">ativo: bool</text>
  <line x1="40" y1="160" x2="210" y2="160" stroke="#334" stroke-width="0.5"/>
  <text class="cls-method" x="52" y="176" dominant-baseline="central">+ autenticar()</text>

  <!-- ── CLIENTE ── -->
  <rect x="40" y="240" width="180" height="26" rx="4" class="cls-header" fill="#0f6e56"/>
  <text class="cls-title" x="130" y="253" text-anchor="middle" dominant-baseline="central">Cliente</text>
  <rect x="40" y="266" width="180" height="150" rx="0" class="cls-box"/>
  <line x1="40" y1="292" x2="220" y2="292" stroke="#334" stroke-width="0.5"/>
  <text class="cls-attr" x="52" y="282" dominant-baseline="central">id: int (PK)</text>
  <text class="cls-attr" x="52" y="304" dominant-baseline="central">nome: str</text>
  <text class="cls-attr" x="52" y="322" dominant-baseline="central">cpf: str (único)</text>
  <text class="cls-attr" x="52" y="340" dominant-baseline="central">email: str</text>
  <text class="cls-attr" x="52" y="358" dominant-baseline="central">telefone: str</text>
  <text class="cls-attr" x="52" y="376" dominant-baseline="central">endereco: str</text>
  <line x1="40" y1="392" x2="220" y2="392" stroke="#334" stroke-width="0.5"/>
  <text class="cls-method" x="52" y="408" dominant-baseline="central">+ validarCpf()</text>

  <!-- ── PRODUTO ── -->
  <rect x="460" y="240" width="185" height="26" rx="4" class="cls-header" fill="#854f0b"/>
  <text class="cls-title" x="552" y="253" text-anchor="middle" dominant-baseline="central">Produto</text>
  <rect x="460" y="266" width="185" height="168" rx="0" class="cls-box"/>
  <line x1="460" y1="292" x2="645" y2="292" stroke="#334" stroke-width="0.5"/>
  <text class="cls-attr" x="472" y="282" dominant-baseline="central">id: int (PK)</text>
  <text class="cls-attr" x="472" y="304" dominant-baseline="central">nome: str</text>
  <text class="cls-attr" x="472" y="322" dominant-baseline="central">descricao: str</text>
  <text class="cls-attr" x="472" y="340" dominant-baseline="central">preco: Decimal</text>
  <text class="cls-attr" x="472" y="358" dominant-baseline="central">qtd_estoque: int</text>
  <text class="cls-attr" x="472" y="376" dominant-baseline="central">estoque_min: int</text>
  <line x1="460" y1="392" x2="645" y2="392" stroke="#334" stroke-width="0.5"/>
  <text class="cls-method" x="472" y="408" dominant-baseline="central">+ verificarEstoque()</text>
  <text class="cls-method" x="472" y="424" dominant-baseline="central">+ atualizarEstoque()</text>

  <!-- ── VENDA ── -->
  <rect x="230" y="470" width="200" height="26" rx="4" class="cls-header" fill="#185fa5"/>
  <text class="cls-title" x="330" y="483" text-anchor="middle" dominant-baseline="central">Venda</text>
  <rect x="230" y="496" width="200" height="150" rx="0" class="cls-box"/>
  <line x1="230" y1="522" x2="430" y2="522" stroke="#334" stroke-width="0.5"/>
  <text class="cls-attr" x="242" y="512" dominant-baseline="central">id: int (PK)</text>
  <text class="cls-attr" x="242" y="534" dominant-baseline="central">data: datetime</text>
  <text class="cls-attr" x="242" y="552" dominant-baseline="central">cliente_id: int (FK)</text>
  <text class="cls-attr" x="242" y="570" dominant-baseline="central">usuario_id: int (FK)</text>
  <text class="cls-attr" x="242" y="588" dominant-baseline="central">valor_total: Decimal</text>
  <line x1="230" y1="604" x2="430" y2="604" stroke="#334" stroke-width="0.5"/>
  <text class="cls-method" x="242" y="620" dominant-baseline="central">+ calcularTotal()</text>
  <text class="cls-method" x="242" y="636" dominant-baseline="central">+ registrar()</text>

  <!-- ── ITEM VENDA ── -->
  <rect x="230" y="690" width="200" height="26" rx="4" class="cls-header" fill="#993c1d"/>
  <text class="cls-title" x="330" y="703" text-anchor="middle" dominant-baseline="central">ItemVenda</text>
  <rect x="230" y="716" width="200" height="82" rx="0" class="cls-box"/>
  <line x1="230" y1="742" x2="430" y2="742" stroke="#334" stroke-width="0.5"/>
  <text class="cls-attr" x="242" y="730" dominant-baseline="central">id: int (PK)</text>
  <text class="cls-attr" x="242" y="754" dominant-baseline="central">venda_id: int (FK)</text>
  <text class="cls-attr" x="242" y="772" dominant-baseline="central">produto_id: int (FK)</text>
  <text class="cls-attr" x="242" y="790" dominant-baseline="central">preco_unitario: Decimal</text>

  <!-- ── RELACIONAMENTOS ── -->
  <!-- Usuario -> Venda -->
  <path d="M210 118 L330 118 L330 470" class="cls-rel" marker-end="url(#arr)"/>
  <text class="cls-card" x="218" y="112">1</text>
  <text class="cls-card" x="335" y="290">N</text>

  <!-- Cliente -> Venda -->
  <path d="M130 416 L130 456 L280 456 L280 470" class="cls-rel" marker-end="url(#arr)"/>
  <text class="cls-card" x="136" y="444">1</text>
  <text class="cls-card" x="285" y="452">N</text>

  <!-- Venda -> ItemVenda (composição) -->
  <line x1="330" y1="646" x2="330" y2="690" class="cls-rel" marker-end="url(#arr)" marker-start="url(#dia)"/>
  <text class="cls-card" x="338" y="658">1</text>
  <text class="cls-card" x="338" y="684">N</text>

  <!-- ItemVenda -> Produto -->
  <path d="M430 762 L552 762 L552 434" class="cls-rel" marker-end="url(#arr)"/>
  <text class="cls-card" x="436" y="756">N</text>
  <text class="cls-card" x="557" y="450">1</text>

  <!-- Legenda -->
  <rect x="40" y="760" width="162" height="48" rx="4" fill="#f5f5f5" stroke="#334" stroke-width="0.5"/>
  <text class="cls-legend" x="52" y="774" dominant-baseline="central" font-weight="500">Legenda</text>
  <line x1="52" y1="787" x2="84" y2="787" class="cls-rel" marker-end="url(#arr)"/>
  <text class="cls-legend" x="90" y="791">Associação 1:N</text>
  <line x1="52" y1="800" x2="84" y2="800" class="cls-rel" marker-end="url(#arr)" marker-start="url(#dia)"/>
  <text class="cls-legend" x="90" y="804">Composição</text>
</svg>
