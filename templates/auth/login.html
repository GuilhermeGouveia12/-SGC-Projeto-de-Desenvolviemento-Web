{% extends 'base/base.html' %}
{% block title %}Login{% endblock %}
{% block content_unauth %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh; background:#f0f4fa;">
  <div class="card p-4" style="width:360px;">
    <div class="text-center mb-4">
      <h3 class="fw-bold" style="color:#1F4E79;">SGC</h3>
      <p class="text-muted small">Sistema de Gestão Comercial</p>
    </div>
    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-danger py-2 small">{{ msg }}</div>
      {% endfor %}
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Usuário</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100" style="background:#1F4E79; border-color:#1F4E79;">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
