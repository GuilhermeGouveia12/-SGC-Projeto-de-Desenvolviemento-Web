<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGC — {% block title %}Sistema de Gestão Comercial{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .sidebar { min-height: 100vh; background-color: #1F4E79; }
    .sidebar a { color: #cfe2f3; text-decoration: none; }
    .sidebar a:hover, .sidebar a.active { color: #fff; background-color: rgba(255,255,255,0.1); border-radius: 6px; }
    .sidebar .brand { color: #fff; font-size: 1.3rem; font-weight: 700; }
    .main-content { padding: 2rem; }
    .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  </style>
</head>
<body>
{% if user.is_authenticated %}
<div class="d-flex">
  <div class="sidebar p-3" style="width: 220px; min-width: 220px;">
    <div class="brand mb-4 ps-2">SGC</div>
    <nav class="d-flex flex-column gap-1">
      <a href="{% url 'web-dashboard' %}" class="p-2"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
      <a href="{% url 'web-clientes-list' %}" class="p-2"><i class="bi bi-people me-2"></i>Clientes</a>
      <a href="{% url 'web-produtos-list' %}" class="p-2"><i class="bi bi-box-seam me-2"></i>Produtos</a>
      <a href="{% url 'web-vendas-list' %}" class="p-2"><i class="bi bi-cart me-2"></i>Vendas</a>
      <a href="{% url 'web-relatorio' %}" class="p-2"><i class="bi bi-bar-chart me-2"></i>Relatórios</a>
      <hr style="border-color: rgba(255,255,255,0.2);">
      <a href="{% url 'web-logout' %}" class="p-2"><i class="bi bi-box-arrow-right me-2"></i>Sair</a>
    </nav>
  </div>
  <div class="flex-grow-1 main-content">
    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}{{ msg.tags }}{% endif %} alert-dismissible fade show" role="alert">
          {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</div>
{% else %}
  {% block content_unauth %}{% endblock %}
{% endif %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
