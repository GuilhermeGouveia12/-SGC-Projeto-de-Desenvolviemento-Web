{% extends 'base/base.html' %}
{% block title %}Clientes{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4>Clientes</h4>
  <a href="{% url 'web-clientes-create' %}" class="btn btn-primary btn-sm">+ Novo cliente</a>
</div>

<div class="alert alert-info py-1 px-2 small mb-3">
  <i class="bi bi-plug"></i> Esta listagem é carregada consumindo a <strong>API REST</strong>
  (<code>GET /clientes/</code>) com autenticação <strong>JWT</strong>.
</div>

<form class="d-flex gap-2 mb-3" method="get">
  <input type="text" name="nome" value="{{ request.GET.nome }}" class="form-control form-control-sm" placeholder="Buscar por nome...">
  <button class="btn btn-outline-secondary btn-sm">Buscar</button>
</form>

<div class="card">
  <table class="table table-hover mb-0">
    <thead class="table-light">
      <tr><th>Nome</th><th>CPF</th><th>E-mail</th><th>Telefone</th><th></th></tr>
    </thead>
    <tbody id="tbody-clientes">
      <tr><td colspan="5" class="text-center text-muted py-3">Carregando via API...</td></tr>
    </tbody>
  </table>
</div>
{% endblock %}

{% block extra_js %}
<script>
(async () => {
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  const tbody = document.getElementById('tbody-clientes');
  try {
    // 1) obtém um token JWT a partir da sessão web
    const tokenResp = await fetch('/auth/token-sessao/', { credentials: 'same-origin' });
    if (!tokenResp.ok) throw new Error('Não foi possível obter o token JWT.');
    const { access } = await tokenResp.json();

    // 2) consome a API REST com o token
    const nome = new URLSearchParams(window.location.search).get('nome') || '';
    const url  = '/clientes/' + (nome ? '?nome=' + encodeURIComponent(nome) : '');
    const resp = await fetch(url, { headers: { 'Authorization': 'Bearer ' + access } });
    if (!resp.ok) throw new Error('Falha ao consumir a API (HTTP ' + resp.status + ').');
    const clientes = await resp.json();

    if (!clientes.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">Nenhum cliente encontrado.</td></tr>';
      return;
    }
    tbody.innerHTML = clientes.map(c => `
      <tr>
        <td>${esc(c.nome)}</td>
        <td>${esc(c.cpf)}</td>
        <td>${esc(c.email)}</td>
        <td>${esc(c.telefone) || '—'}</td>
        <td class="text-end">
          <a href="/web/clientes/${c.id}/editar/" class="btn btn-sm btn-outline-secondary">Editar</a>
          <a href="/web/clientes/${c.id}/excluir/" class="btn btn-sm btn-outline-danger">Excluir</a>
        </td>
      </tr>`).join('');
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-3">Erro ao carregar via API: ${esc(e.message)}</td></tr>`;
  }
})();
</script>
{% endblock %}
